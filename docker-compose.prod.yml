services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: haman_postgres
      DB_PORT: 5432
      DB_DATABASE: haman_planner
      DB_USERNAME: haman_planner
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - planner_net
      - haman_net
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --no-reload --host=0.0.0.0 --port=8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: haman_postgres
      DB_PORT: 5432
      DB_DATABASE: haman_planner
      DB_USERNAME: haman_planner
    networks:
      - planner_net
      - haman_net
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: haman_postgres
      DB_PORT: 5432
      DB_DATABASE: haman_planner
      DB_USERNAME: haman_planner
    networks:
      - planner_net
      - haman_net
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"

networks:
  planner_net:
    driver: bridge

  haman_net:
    external: true
    name: hamman-platform_haman_net
